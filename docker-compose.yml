# Self-hosted Brick (brick.do) stack: Postgres + API server (serves the app client and public
# pages) + Next.js landing + an internal nginx that routes between them.
#
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
# Only host port 8090 is published, bound to localhost; put your TLS-terminating
# proxy (e.g. the xCloud nginx) in front of it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brick
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: brick
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brick -d brick']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
      args:
        PUBLICVAR_BRICK_HOST: ${BRICK_HOST:?Set BRICK_HOST in .env}
        PUBLICVAR_BRICK_DOMAIN: ${BRICK_COOKIE_DOMAIN:-${BRICK_HOST}}
        PUBLICVAR_BRICK_URL: https://${BRICK_HOST}
        PUBLICVAR_ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
        PUBLICVAR_BRICK_CLIENT_BANNER: ${BRICK_CLIENT_BANNER:-}
        PUBLICVAR_EXTERNAL_TLS_TERMINATION: ${EXTERNAL_TLS_TERMINATION:-true}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HTTP_PORT: '3000'
      HTTPS_PORT: '3001'
      WEBSOCKET_PORT: '3002'
      CLIENT_BUILD_PATH: apps/client/build
      PUBLIC_CLIENT_BUILD_PATH: apps/public-client/build
      PUBLICVAR_BRICK_HOST: ${BRICK_HOST}
      PUBLICVAR_BRICK_DOMAIN: ${BRICK_COOKIE_DOMAIN:-${BRICK_HOST}}
      PUBLICVAR_BRICK_URL: https://${BRICK_HOST}
      BRICK_IP: ${BRICK_IP:-}
      MAINTENANCE_MODE: 'false'
      SELF_HOSTED_PLAN: ${SELF_HOSTED_PLAN:-true}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      EXTERNAL_TLS_TERMINATION: ${EXTERNAL_TLS_TERMINATION:-true}
      IMAGE_STORAGE: ${IMAGE_STORAGE:-local}
      UPLOADS_DIR: /usr/brick/uploads
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: brick
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: brick
      DB_SSL: 'false'
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CONFIRM_EMAIL_JWT_SECRET: ${CONFIRM_EMAIL_JWT_SECRET:-}
      CHANGE_EMAIL_SECRET: ${CHANGE_EMAIL_SECRET:-}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Brick}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_ENDPOINT_SECRET: ${STRIPE_ENDPOINT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      IMAGE_UPLOAD_S3_ENDPOINT: ${IMAGE_UPLOAD_S3_ENDPOINT:-}
      IMAGE_UPLOAD_S3_CDN_ENDPOINT: ${IMAGE_UPLOAD_S3_CDN_ENDPOINT:-}
      IMAGE_UPLOAD_S3_BUCKET_NAME: ${IMAGE_UPLOAD_S3_BUCKET_NAME:-}
      IMAGE_UPLOAD_S3_REGION: ${IMAGE_UPLOAD_S3_REGION:-}
      IMAGE_UPLOAD_S3_KEY_ID: ${IMAGE_UPLOAD_S3_KEY_ID:-}
      IMAGE_UPLOAD_S3_SECRET_KEY: ${IMAGE_UPLOAD_S3_SECRET_KEY:-}
      IMAGE_UPLOAD_S3_FORCE_PATH_STYLE: ${IMAGE_UPLOAD_S3_FORCE_PATH_STYLE:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_ACCOUNT_KEY: ${ACME_ACCOUNT_KEY:-}
      HELPCRUNCH_API_KEY: ${HELPCRUNCH_API_KEY:-}
    volumes:
      - uploads:/usr/brick/uploads

  landing:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: landing
      args:
        PUBLICVAR_BRICK_HOST: ${BRICK_HOST}
        PUBLICVAR_BRICK_DOMAIN: ${BRICK_COOKIE_DOMAIN:-${BRICK_HOST}}
        PUBLICVAR_BRICK_URL: https://${BRICK_HOST}
        PUBLICVAR_ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLICVAR_BRICK_HOST: ${BRICK_HOST}

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
      - landing
    ports:
      - '127.0.0.1:8090:80'
    environment:
      BRICK_HOST: ${BRICK_HOST}
      NGINX_ENVSUBST_FILTER: '^BRICK_'
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - uploads:/var/www/uploads:ro

# Named network so companion stacks (see docker-compose.pagehost.yml) can reach the proxy
networks:
  default:
    name: brick_net

volumes:
  db-data:
  uploads:
